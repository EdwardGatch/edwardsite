<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Foreman Timesheets</title>
<style>
/* Layout: built from DESIGN_SYSTEM.md 2.0 + BRAND.md 2.0. Demo bar; Foreman = phone frame with frosted tab bar; Office = frosted top bar + icon sidebar; Dashboard (overview), Review, Budgets, Export (working screens). Light and dark both designed. */
:root{
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-hover:#F3F5F7; --surface-sunken:#F1F3F5;
  --text:#1C2024; --text-secondary:#6B7280; --text-tertiary:#8A9099;
  --border-subtle:#EDEFF1; --border:#E6E8EB; --border-strong:#C9CED4;
  --accent:#0A63D6; --accent-hover:#0957BD; --accent-pressed:#084BA3; --accent-soft:#EAF2FD; --accent-text:#0A63D6; --on-accent:#FFFFFF;
  --neutral-bg:#F1F1EF; --neutral-fg:#55534E; --warning-bg:#FFF1DB; --warning-fg:#A85400;
  --success-bg:#E3F5E8; --success-fg:#1D7436; --info-bg:#E4EEFC; --info-fg:#0B57B8; --error-bg:#FEE4E2; --error-fg:#B42318;
  --weekend:#EEF1F4; --weekend-hover:#E6EAEE;
  --fill:rgba(118,118,128,.12); --fill-hover:rgba(118,118,128,.18); --thumb:#FFFFFF; --bar-bg:rgba(255,255,255,.72);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --chart-1:#0A63D6; --chart-2:#E07B24; --chart-3:#1E9A9A; --chart-4:#8A5CD6;
  --frame:#1C2024; --scrim:rgb(16 24 40 / .4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.05); --shadow-md:0 4px 16px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#171B20; --surface-hover:#1E232A; --surface-sunken:#13171B;
  --text:#E7EAEE; --text-secondary:#9AA3AD; --text-tertiary:#7D8691;
  --border-subtle:#1F242A; --border:#262C33; --border-strong:#3A424C;
  --accent:#2F6FDB; --accent-hover:#3A7BE6; --accent-pressed:#2861C2; --accent-soft:#16253D; --accent-text:#7CB0F7; --on-accent:#FFFFFF;
  --neutral-bg:#2A2E33; --neutral-fg:#CDD1D6; --warning-bg:#3A2A12; --warning-fg:#F2B25C;
  --success-bg:#14301F; --success-fg:#6FD394; --info-bg:#132A48; --info-fg:#8DB8F5; --error-bg:#3D1A17; --error-fg:#F58A80;
  --weekend:#1C2127; --weekend-hover:#222830;
  --fill:rgba(118,118,128,.24); --fill-hover:rgba(118,118,128,.32); --thumb:#3A4049; --bar-bg:rgba(23,27,32,.72);
  --shadow-card:none;
  --chart-1:#4C8DF0; --chart-2:#F0A055; --chart-3:#45C2C2; --chart-4:#A98AE8;
  --frame:#2A2F36; --scrim:rgb(0 0 0 / .6);
  --shadow-sm:none; --shadow-md:0 4px 16px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#171B20; --surface-hover:#1E232A; --surface-sunken:#13171B;
  --text:#E7EAEE; --text-secondary:#9AA3AD; --text-tertiary:#7D8691;
  --border-subtle:#1F242A; --border:#262C33; --border-strong:#3A424C;
  --accent:#2F6FDB; --accent-hover:#3A7BE6; --accent-pressed:#2861C2; --accent-soft:#16253D; --accent-text:#7CB0F7; --on-accent:#FFFFFF;
  --neutral-bg:#2A2E33; --neutral-fg:#CDD1D6; --warning-bg:#3A2A12; --warning-fg:#F2B25C;
  --success-bg:#14301F; --success-fg:#6FD394; --info-bg:#132A48; --info-fg:#8DB8F5; --error-bg:#3D1A17; --error-fg:#F58A80;
  --weekend:#1C2127; --weekend-hover:#222830;
  --fill:rgba(118,118,128,.24); --fill-hover:rgba(118,118,128,.32); --thumb:#3A4049; --bar-bg:rgba(23,27,32,.72);
  --shadow-card:none;
  --chart-1:#4C8DF0; --chart-2:#F0A055; --chart-3:#45C2C2; --chart-4:#A98AE8;
  --frame:#2A2F36; --scrim:rgb(0 0 0 / .6);
  --shadow-sm:none; --shadow-md:0 4px 16px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h-page{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}.h-sec{font-size:20px;line-height:1.3}.h-sub{font-size:15px;line-height:1.35;font-weight:600}
.hero{font-size:48px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
button,select,input,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{flex:none;vertical-align:-3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-secondary)}.tert{color:var(--text-tertiary)}
.cap{font-size:12px;line-height:16px;color:var(--text-secondary)}
.sup{font-size:13px;line-height:19px;color:var(--text-secondary)}
.ctx{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-secondary);align-items:center}
.ctx span{display:inline-flex;gap:5px;align-items:center}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:500}

/* demo bar */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;flex:none}
.brand b{font-size:16px;font-weight:600;display:block;line-height:1.2}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface-sunken);color:var(--text-secondary);font-weight:500;border:1px solid var(--border)}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px}
.views button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--text-secondary);display:flex;gap:6px;align-items:center;min-height:34px}
.views button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.views{border-radius:12px!important}.views button{border-radius:10px!important}
.demo-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* controls */
.btn{border:1px solid transparent;background:var(--fill);color:var(--text);padding:0 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;transition:background-color .12s}
.btn:hover{background:var(--fill-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}.btn.primary:active{background:var(--accent-pressed)}
.btn.block{width:100%;min-height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--error-fg);background:var(--error-bg)}
.link{border:0;background:none;color:var(--accent-text);font-weight:500;padding:4px 0;display:inline-flex;gap:5px;align-items:center;min-height:32px}
.link:hover{text-decoration:underline}
.ibtn{border:0;background:none;color:var(--text-secondary);width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center}
.ibtn:hover{background:var(--fill);color:var(--text)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ctl{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 12px;min-height:40px;color:var(--text)}
select.ctl{padding-right:8px}
.ctl:hover{border-color:var(--border-strong)}
textarea.ctl{padding:10px 12px;min-height:72px;resize:vertical}
select.s{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 6px;font-size:13px;min-height:34px;min-width:0;color:var(--text);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:0 12px;font-weight:500;font-size:13px;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.pills button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.pills .sep{width:1px;height:20px;background:var(--border);margin:0 4px}

/* status pill */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:18px;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.chip.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.chip.warning{background:var(--warning-bg);color:var(--warning-fg)}
.chip.success{background:var(--success-bg);color:var(--success-fg)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.chip.error{background:var(--error-bg);color:var(--error-fg)}
.chip.none{background:none;color:var(--text-secondary);border:1px dashed var(--border-strong)}
.ptag{display:inline-block;font-size:12px;padding:0 6px;border-radius:6px;background:var(--surface-sunken);border:1px solid var(--border);color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}

/* phone */
.stage{display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:390px;height:820px;background:var(--bg);border:10px solid var(--frame);border-radius:42px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.ph-status{display:flex;justify-content:space-between;padding:10px 24px 6px;font-size:12px;font-weight:600}
.ph-body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ph-body>*{flex-shrink:0}
.ph-bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border)}
.ph-footer{padding:10px 16px 8px;display:flex;flex-direction:column;gap:6px}
.ph-nav{display:flex;padding-bottom:10px}
.ph-nav button{flex:1;border:0;background:none;padding:8px 0 2px;font-weight:500;color:var(--text-secondary);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.ph-nav button[aria-current="true"]{color:var(--accent-text)}
@media (max-width:440px){.phone{border:0;border-radius:0;height:auto;min-height:680px;box-shadow:none}.ph-body{overflow:visible}.ph-bottom{position:sticky}}
.back{border:0;background:none;color:var(--accent-text);font-weight:500;padding:2px 0;align-self:flex-start;display:inline-flex;gap:4px;align-items:center;min-height:32px}
.notif{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.notif .ic{color:var(--accent-text);margin-top:1px}
.notif b{display:block;font-size:13px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;box-shadow:var(--shadow-sm)}
.summary .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.summary .right{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
.proj-pick{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;border:0;background:none;padding:2px 0;color:var(--text)}
.crew{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card);background:var(--surface);overflow:hidden}
.crew-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.crew-row:first-child{border-top:0}
.crew-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crew-name{font-weight:500}
.crew-sub{font-size:12px;color:var(--text-secondary)}
.crew-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crew-grid .full{grid-column:1/-1}
.crew-grid select{width:100%}
.mini{font-size:11px;color:var(--text-secondary)}
.flag{font-size:12px;line-height:16px;padding:6px 8px;border-radius:10px;display:flex;gap:6px;align-items:flex-start}
.flag.err{background:var(--error-bg);color:var(--error-fg)}
.flag.info{background:var(--warning-bg);color:var(--warning-fg)}
.flag.ok{background:var(--success-bg);color:var(--success-fg)}
.flag.note{background:var(--accent-soft);color:var(--accent-text)}
.ro-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;border-top:1px solid var(--border)}
.ro-row:first-child{border-top:0}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;color:var(--text)}
.li:hover{background:var(--surface-hover)}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:12px 16px 18px;max-height:82%;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-lg)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto}
.sheet .list{overflow-y:auto;gap:0}
.sheet .list>*{flex-shrink:0}
.pick{border:0;border-top:1px solid var(--border);background:none;padding:8px 4px;display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:48px;color:var(--text)}
.pick:first-child{border-top:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-sunken);border:1px solid var(--border);color:var(--text-secondary);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.check{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--border);min-height:52px;cursor:pointer}
.check:first-child{border-top:0}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.check.off .crew-name{color:var(--text-secondary)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border:1px solid transparent;border-radius:10px;padding:0 10px;color:var(--text-secondary);min-height:40px}
.search input{border:0;background:none;outline:none;width:100%;color:var(--text);min-height:38px}
.notes{display:flex;flex-direction:column;gap:6px}
.notes .n{background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:8px;padding:8px 10px;font-size:13px}

/* office */
.office{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:clip;display:flex;flex-direction:column}
.o-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);min-height:56px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.o-bar .co{font-weight:600;display:flex;gap:8px;align-items:center;margin-right:4px}
.o-bar .co .mark{width:26px;height:26px;border-radius:7px;font-size:13px}
.o-bar .search{flex:1;min-width:180px;max-width:420px;min-height:36px}
.o-bar select{min-height:36px;width:auto}
.o-main{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:720px}
.side{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side button{border:0;background:none;text-align:left;display:flex;gap:10px;align-items:center;padding:0 12px;border-radius:10px;color:var(--text);font-weight:500;min-height:38px;white-space:nowrap}
.side button:hover{background:var(--surface-hover)}
.side button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.side .foot{margin-top:auto;padding:12px;font-size:11px;color:var(--text-tertiary)}
.content{background:var(--bg);padding:20px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:820px){.o-main{grid-template-columns:minmax(0,1fr)}.side{flex-direction:row;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}.side .foot{display:none}.content{padding:16px}}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pnav{display:flex;gap:4px;align-items:center}
.pnav select{min-height:36px;width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-card)}
.kpi .k{color:var(--text-secondary);font-size:12px;display:flex;gap:6px;align-items:center;font-weight:500}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}
.kpi .s{font-size:12px;color:var(--text-tertiary)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chart-bars{position:relative;display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:132px;border-bottom:1px solid var(--border-strong);padding-top:16px}
.chart-bars .grid{position:absolute;left:0;right:0;border-top:1px solid var(--border-subtle);pointer-events:none}
.bar{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.bar .b{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bar .v{font-size:10.5px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.sel .b{background:var(--accent-hover);box-shadow:0 0 0 2px var(--accent-soft)}
.bar button{position:absolute;inset:0;border:0;background:none;border-radius:4px}
.bar button:hover{background:var(--surface-hover);opacity:.35}
.chart-labels{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:4px;font-size:10.5px;color:var(--text-secondary);text-align:center;line-height:1.3}
.chart-labels .we{color:var(--text-tertiary)}
@media (max-width:640px){.bar .v{display:none}}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:1250px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:12px;color:var(--text-secondary);font-weight:500;padding:0 10px;height:40px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:0 10px;height:46px;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-hover)}
tr.sel td{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-top:1px solid var(--border);border-bottom:0}
.matrix td,.matrix th{padding:0 8px;text-align:right}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.matrix th.we,.matrix td.we{color:var(--text-tertiary);background:var(--surface-sunken)}
.matrix td.empty{color:var(--text-tertiary)}
.cell-code{display:block;font-size:10.5px;color:var(--text-tertiary);line-height:1}
.hb{display:flex;flex-direction:column;gap:8px}

<script>
(function(){
const MODE='foreman'; /* build: 'both' | 'foreman' | 'office' */
/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=s=>parse(s).getDay();
const mondayOf=s=>addDays(s,-((dow(s)+6)%7));
const TODAY=iso(new Date());

/* hours & validation */
function span(sh,row){const base=sh.rows[0].start;const a=t=>t<base-360?t+1440:t;const s=a(row.start);let e=row.end==null?null:a(row.end);if(e!=null&&e<=s)e+=1440;return[s,e]}
const rowHours=(sh,r)=>{const[s,e]=span(sh,r);return e==null?null:(e-s)/60};
const sheetHours=sh=>sh.rows.reduce((t,r)=>t+(rowHours(sh,r)||0),0);
const nextDay=(sh,r)=>{const[,e]=span(sh,r);return e!=null&&e>=1440};
const fmtH=h=>h==null?'—':h.toFixed(2);
function validate(sh){
  const errors=[],flags={};const add=(w,t,m)=>{(flags[w]=flags[w]||[]).push({type:t,msg:m})};
  const[,fe]=span(sh,sh.rows[0]);
  sh.rows.forEach((r,i)=>{const[s,e]=span(sh,r);const nm=W(r.workerId).name;
    if(!r.costCode){add(r.workerId,'err','No cost code.');errors.push(nm+' has no cost code.')}
    if(r.end==null){add(r.workerId,'err','Still signed in.');errors.push(nm+' has no end time.')}
    if(i>0&&e!=null&&fe!=null&&e>fe){add(r.workerId,'err','Ends after the foreman ('+fmtTime(sh.rows[0].end)+').');errors.push(nm+' ends after the foreman.')}
    D.sheets.filter(o=>o.id!==sh.id&&o.date===sh.date).forEach(o=>{const or=o.rows.find(x=>x.workerId===r.workerId);if(!or)return;const[os,oe]=span(o,or);
      if(e!=null&&oe!=null&&s<oe&&os<e){add(r.workerId,'err','Overlaps #'+o.projectId+' ('+fmtTime(or.start)+' – '+fmtTime(or.end)+').');errors.push(nm+' overlaps another timesheet.')}
      else add(r.workerId,'info','Also on #'+o.projectId+' '+P(o.projectId).short+' today ('+fmtTime(or.start)+' – '+fmtTime(or.end)+').')});
  });
  return{errors:uniq(errors),flags};
}

  const cell=(p,d,i)=>{const de=es.filter(e=>e.pid===p&&e.date===d);if(!de.length)return `<td class="${cls(d,i)}"></td>`;
    const h=hrsOf(de);const bad=de.some(e=>errOf(e).length);const ed=de.find(canEditRow)||de[0];const on=sel&&de.includes(sel);const canE=de.some(canEditRow);
    const tip=de.map(e=>`${fmtTime(e.row.start)} – ${fmtTime(e.row.end)} · ${e.row.costCode} ${codeDesc(e.row.costCode,p)}`).join(', ');

    return `<td class="${cls(d,i)}${bad?' bad':''}${on?' sel':''}" title="${esc(tip)}"><button class="cellbtn" data-a="ecell" data-s="${ed.sheet.id}" aria-pressed="${on?'true':'false'}" aria-label="${canE?'Edit':'View'} ${fmtDate(d)} on #${p}: ${h.toFixed(2)} hours">${inner}</button></td>`};
  const dayEs=d=>es.filter(e=>e.date===d);
  const editor=sel?(()=>{const r=sel.row;const fl=errOf(sel);const canE=canEditRow(sel);
    const why=r.exp?`${ic('lock',13)} Exported by ${esc(r.exp.by)}, ${esc(r.exp.at)} · view only`:r.appr?`${ic('check',13)} Approved by ${esc(r.appr.by)}, ${esc(r.appr.at)} · view only`:canE?'Every change is saved in the history.':`${ic('clock',13)} Waiting on ${esc(pmName(sel.pid))} · view only`;
    const ro=(l,v)=>`<div class="field"><span class="mini">${l}</span><div class="ro-val num">${v}</div></div>`;
    return `<div class="editrow" data-tour="editrow">
      <div class="ed-h"><b>${fmtDate(sel.date)} · #${sel.pid} ${esc(P(sel.pid).short)}</b><span class="cap">${why}</span></div>
      ${canE?`<label class="field"><span class="mini">Start</span>${timeSel(r.start,`data-c="et" data-f="start" data-s="${sel.sheet.id}" data-w="${w}" aria-label="Start ${fmtDate(sel.date)}"`)}</label>
      <label class="field"><span class="mini">End${nextDay(sel.sheet,r)?' (next day)':''}</span>${timeSel(r.end,`data-c="et" data-f="end" data-s="${sel.sheet.id}" data-w="${w}" aria-label="End ${fmtDate(sel.date)}"`)}</label>
      <label class="field"><span class="mini">Cost code</span>${codeSel(r.costCode,`class="s" data-c="erc" data-s="${sel.sheet.id}" data-w="${w}" aria-label="Cost code ${fmtDate(sel.date)}"`,'',sel.pid)}</label>`
      :`${ro('Start',fmtTime(r.start))}${ro('End'+(nextDay(sel.sheet,r)?' (next day)':''),fmtTime(r.end)+(nextDay(sel.sheet,r)?' +1':''))}${ro('Cost code',`${r.costCode} ${esc(codeDesc(r.costCode,sel.pid))} · ${sel.hours.toFixed(2)} h`)}`}
      <button class="btn" data-a="ecell-close">${canE?'Done':'Close'}</button>
      ${fl.length?`<div class="flag err" style="grid-column:1/-1">${ic('alert',14)}<span>${esc(fl[0].msg)}</span></div>`:''}</div>`})():'';
  return `<div class="row-between" style="align-items:flex-start"><div><div class="cap">${wo.id} · ${esc(wo.trade)} · ${money(wo.rate)}/h</div><h3 class="h-sec" style="font-size:24px">${esc(wo.name)}</h3><div class="ctx"><span>${ic('calendar',14)}${periodLabel(ps)}</span>${chip(st)}</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${action}
    ${mine.length&&!ended(ps)?`<span class="cap">${ic('calendar',13)} Approval opens after ${fmtDate(addDays(ps,13))}. You can still correct times and codes.</span>`:''}
    ${myApproved&&!mine.length&&!anyExp?`<button class="link" data-a="unapprove">${ic('undo',15)}Undo your approval to make changes</button>`:''}</div></div>
  ${errDays.length?`<div class="flag err">${ic('alert',14)}<span>${errDays.length} day${errDays.length>1?'s need':' needs'} fixing before approval. They're marked in red in the calendar.</span></div>`:''}
  ${othersPending.length?`<div class="banner warn">${ic('clock',16)}<span>Also waiting on ${uniq(othersPending.map(p=>pmName(p))).join(', ')} for ${othersPending.map(p=>'#'+p+' '+esc(P(p).short)).join(', ')}. Payroll can export ${esc(first)} once every PM has approved.</span></div>`:''}
  ${st==='approved'?`<div class="banner ok">${ic('check',16)}Approved by every PM. Ready to export.</div>`:''}
  ${anyExp?(S.unlocking?`<label class="field"><span class="label">Reason for unlocking (saved in the history)</span><input class="ctl" id="ureason" placeholder="e.g. Wrong cost code on Oct 22"></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="unlock-cancel">Cancel</button><button class="btn danger" data-a="unlock">Unlock ${esc(first)}'s pay period</button></div>`
      :`<div class="banner lock">${ic('lock',16)}<span style="flex:1">Exported to payroll and locked.</span><button class="link" style="color:inherit" data-a="unlock-start">Unlock to correct</button></div>`):''}
  <div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div><span class="cap">Hours</span><b>${hours.toFixed(2)}</b></div><div><span class="cap">Days worked</span><b>${uniq(es.map(e=>e.date)).length}</b></div><div><span class="cap">Gross wages</span><b>${money(wageOf(es))}</b></div><div><span class="cap">Labor cost (incl. ${D.burden}% burden)</span><b>${money(costOf(es))}</b></div></div>
  <div class="tbl-wrap" data-tour="wcal"><table class="mx wcal"><colgroup><col style="width:196px">${days.map(()=>'<col>').join('')}<col style="width:64px"><col style="width:92px"></colgroup>
    <thead><tr><th class="nm">Project</th>${days.map((d,i)=>`<th class="${cls(d,i)}">${parse(d).toLocaleDateString('en-CA',{weekday:'short'}).slice(0,3)}<br>${parse(d).getDate()}</th>`).join('')}<th class="tot">Hours</th><th class="tot">Labor cost</th></tr></thead><tbody>
    ${pids.map(p=>{const pe=es.filter(e=>e.pid===p);return `<tr><td class="nm"><b>#${p} ${esc(P(p).name)}</b><span class="pmline">${chip(sliceSt(p))}<small>${esc(pmName(p))}${u.role==='pm'&&P(p).pm===u.id?' (you)':''}</small></span></td>${days.map((d,i)=>cell(p,d,i)).join('')}<td class="tot">${hrsOf(pe).toFixed(2)}</td><td class="tot">${money(costOf(pe))}</td></tr>`}).join('')}
    </tbody><tfoot>
      <tr><td class="nm">Hours</td>${days.map((d,i)=>{const h=hrsOf(dayEs(d));return `<td class="${cls(d,i)}">${h?h.toFixed(2):''}</td>`}).join('')}<td class="tot">${hours.toFixed(2)}</td><td class="tot">${money(costOf(es))}</td></tr>
    </tfoot></table></div>
  ${editor}
  <span class="cap">Each cell shows the hours and cost code for that day. Select a day to see its start and end times${anyEdit?'; on your projects you can change them and the cost code until you approve':''}. The status under each project is that PM's approval.</span>
  <div class="two"><div class="stack" style="gap:8px"><span class="label">By cost code</span>${hb2(byC)}</div>
    <div class="stack" style="gap:8px"><span class="label">History</span><div class="audit">${audit.length?audit.map(x=>`<div><span class="w">${esc(x.at)}</span><span><b style="font-weight:500">${esc(x.by)}</b> · ${esc(x.text)}</span></div>`).join(''):'<span class="sup">No changes or approvals yet.</span>'}</div></div></div>
  ${notes.length?`<div class="stack" style="gap:8px"><span class="label">Foreman notes</span><div class="notes">${notes.map(n=>`<div class="n"><b>${esc(n.by)}</b> <span class="cap">${fmtDate(n.d)}</span><br>${esc(n.text)}</div>`).join('')}</div></div>`:''}`;
}

/* --- by project, pay period --- */
function projectPeriod(){const ps=S.period;const pids=scopePids();if(!S.oProj||!pids.includes(S.oProj))S.oProj=pids[0];const pid=S.oProj;
  const days=periodDays(ps);const es=entries(ps,e=>e.pid===pid);const ws=uniq(es.map(e=>e.wid)).sort((a,b)=>W(a).name.localeCompare(W(b).name));
  const tot=hrsOf(es),totC=costOf(es);const we=d=>dow(d)===0||dow(d)===6;
  const cls=(d,i)=>[we(d)?'we':'',i>0&&dow(d)===1?'wk':''].join(' ');
  const sliceSt=w=>{const pe=es.filter(e=>e.wid===w);return pe.every(e=>e.row.exp)?'exported':pe.every(e=>e.row.appr)?'approved':'awaiting'};
  const appr=ws.filter(w=>sliceSt(w)!=='awaiting').length;
  const codes=uniq(es.map(e=>e.row.costCode)).sort().map(c=>{const ce=es.filter(e=>e.row.costCode===c);return{c,h:hrsOf(ce),cost:costOf(ce)}});
  return `<div class="panel">
    <div class="row-between"><div><h3 class="h-sec">#${pid} ${esc(P(pid).short)}</h3><div class="ctx"><span>${ic('user',14)}PM ${esc(pmName(pid))}</span><span>${ic('users',14)}Foreman ${P(pid).foremen.map(f=>esc(W(f).name)).join(', ')}</span><span>${ic('check',14)}${appr} of ${ws.length} workers approved</span></div></div>
      <select class="ctl" style="width:auto" data-c="oproj" aria-label="Project">${pids.map(p=>`<option value="${p}"${p===pid?' selected':''}>#${p} ${esc(P(p).short)}</option>`).join('')}</select></div>
    ${ws.length?`<div class="tbl-wrap"><table class="mx"><colgroup><col style="width:168px">${days.map(()=>'<col>').join('')}<col style="width:72px"></colgroup>
    <thead><tr><th class="nm">Worker</th>${days.map((d,i)=>`<th class="${cls(d,i)}">${parse(d).toLocaleDateString('en-CA',{weekday:'short'}).slice(0,3)}<br>${parse(d).getDate()}</th>`).join('')}<th class="tot">Total</th></tr></thead><tbody>
    ${ws.map(w=>{const wes=es.filter(e=>e.wid===w);return `<tr data-a="openworker" data-w="${w}" tabindex="0"><td class="nm" title="${esc(W(w).trade)}"><b>${esc(W(w).name)}</b>${chip(sliceSt(w))}</td>${days.map((d,i)=>{const de=wes.filter(e=>e.date===d);const h=hrsOf(de);
      return `<td class="${cls(d,i)}" ${h?`title="${de.map(e=>fmtTime(e.row.start)+' – '+fmtTime(e.row.end)).join(', ')}"`:''}>${h?`<span class="hrs">${h.toFixed(2)}</span><span class="cd">${uniq(de.map(e=>e.row.costCode)).join(' ')}</span>`:''}</td>`}).join('')}<td class="tot">${hrsOf(wes).toFixed(2)}</td></tr>`}).join('')}
    </tbody><tfoot><tr><td class="nm">Crew on site</td>${days.map((d,i)=>`<td class="${cls(d,i)}">${uniq(es.filter(e=>e.date===d).map(e=>e.wid)).length||''}</td>`).join('')}<td class="tot"></td></tr>
      <tr><td class="nm">Hours</td>${days.map((d,i)=>{const h=hrsOf(es.filter(e=>e.date===d));return `<td class="${cls(d,i)}">${h?h.toFixed(1):''}</td>`}).join('')}<td class="tot">${tot.toFixed(2)}</td></tr></tfoot></table></div>
    <span class="cap">Each cell shows the hours and cost code for that day. Weekends are shaded and a line marks the start of each week. The status under each name is their approval on #${pid}; select a worker to see their whole pay period.</span>`
    :`<div class="empty">${ic('folder',28)}<b>No hours on this project in this pay period</b></div>`}
  </div>
  ${ws.length?`<div class="panel"><div class="row-between"><b class="h-sub">Hours and cost by cost code</b><span class="cap">#${pid} · ${periodLabel(ps)} · incl. ${D.burden}% burden</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Cost code</th><th class="n">Hours</th><th class="n">Labor cost</th><th class="n">Share of project cost</th></tr></thead><tbody>
    ${codes.map(c=>`<tr><td>${c.c} <span class="muted">${esc(codeDesc(c.c,pid))}</span></td><td class="n">${c.h.toFixed(2)}</td><td class="n">${money(c.cost)}</td><td class="n">${shareCell(c.cost,totC)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="n">${tot.toFixed(2)}</td><td class="n">${money(totC)}</td><td></td></tr></tfoot></table></div></div>`:''}`;
}

function exportSet(ps){const ws=uniq(entries(ps).map(e=>e.wid));const st=Object.fromEntries(ws.map(w=>[w,wpStatus(ps,w)]));

function tourGo(i){if(i<0)return;if(i>=T.steps.length){T.on=false;openFinish();return}

function placeTour(){if(!T.on||T.mode!=='tour'||!tourRoot)return;const st=T.steps[T.i];const el=q(st.sel);if(!el)return;T.el=el;

  const hole=tourRoot.querySelector('.t-hole');Object.assign(hole.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  const B=k=>tourRoot.querySelector(`[data-b="${k}"]`);const S2=(k,l,t,ww,hh)=>Object.assign(B(k).style,{left:l+'px',top:t+'px',width:Math.max(0,ww)+'px',height:Math.max(0,hh)+'px'});
  S2('t',0,0,vw,y);S2('b',0,y+h,vw,vh-y-h);S2('l',0,y,x,h);S2('r',x+w,y,vw-x-w,h);
  const tapOk=st.tap&&!el.disabled;if(tapOk)S2('c',0,0,0,0);else S2('c',x,y,w,h);
  const pop=tourRoot.querySelector('.t-pop');if(!pop)return;const pw=pop.offsetWidth,ph=pop.offsetHeight,gap=12;
  let top,left=Math.min(Math.max(8,x+w/2-pw/2),vw-pw-8);const midTop=Math.min(Math.max(8,y+h/2-ph/2),vh-ph-8);
  if(vh-(y+h)>=ph+gap+8)top=y+h+gap;else if(y>=ph+gap+8)top=y-ph-gap;
  else if(vw-(x+w)>=pw+gap+8){left=x+w+gap;top=midTop}else if(x>=pw+gap+8){left=x-pw-gap;top=midTop}
  else top=Math.max(8,vh-ph-8);Object.assign(pop.style,{left:left+'px',top:top+'px'})}

      rows.forEach(([code,h,cost])=>{const b=D.budgets[pid][code];b.hours=h;b.cost=cost});D.budgetLog.push({pid,at:nowStamp(),by:U().name,text:`Imported ${f.name}: ${rows.length} cost codes updated`+(bad.length?`, ${bad.length} rows skipped (line ${bad.join(', ')})`:'')});
      render();toast(`Imported ${rows.length} cost codes into #${pid}`+(bad.length?` · ${bad.length} skipped`:''))};rd.readAsText(f);return}
  else if(c==='anchor'){if(!v)return;D.anchor=v;S.period=addDays(curPeriod(),-14);S.exPeriod=null;S.oWorker=null;S.ecell=null;return toast('Pay periods now start '+fmtDate(v)+', every 14 days')}
  else if(c==='rolecode'){D.roleCode[e.target.dataset.r]=v;return toast(e.target.dataset.r+' now defaults to '+v+' '+codeDesc(v))}
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='pickq'){S.pickQ=e.target.value;render()}else if(e.target.id==='wq'){S.wq=e.target.value;render()}});
seedCodes();seedBudgets();applyTheme();render();
if(MODE!=='both'&&!lsGet(LS_KEY))setTimeout(openWelcome,350);
})();
</script>
